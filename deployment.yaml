apiVersion: apps/v1
kind: Deployment
metadata:
name: placement-portal
spec:
replicas: 2

selector:
matchLabels:
app: placement-portal

template:
metadata:
labels:
app: placement-portal

```
spec:
  containers:
    - name: placement-portal
      image: sureshkrishnak/student-placement-portal:v1
      ports:
        - containerPort: 80

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10

      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
```

---

apiVersion: v1
kind: Service
metadata:
name: placement-portal-service

spec:
type: NodePort

selector:
app: placement-portal

ports:
- port: 80
targetPort: 80
nodePort: 30080
